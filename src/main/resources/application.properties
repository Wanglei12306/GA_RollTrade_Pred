server.port=8081
spring.application.name=ga-rolltrade-pred
# Allow resampled intraday files (for example BTC 15m) while keeping raw
# multi-gigabyte 1m files out of the in-memory upload path.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
spring.thymeleaf.cache=false
logging.level.com.example.quant=INFO
